# Netlify deployment config for the Vite + React SPA.
#
# The repo uses pnpm only: npm refuses to run here because of devEngines in
# package.json. pnpm 11 needs Node 22, the version CI uses.

[build]
  command = "pnpm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Skip husky git-hook install in CI (no dev hooks needed to build)
  HUSKY = "0"

# SPA fallback: react-router owns the routes, so deep links and reloads
# (e.g. /online/play/ABC123) must serve index.html rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and the manifest must never go stale, or an installed
# game would keep an old worker.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Allow the Firebase Google sign-in popup (signInWithPopup) to talk back to
# the opener. Mirrors the COOP header the Vite dev server sets; without it a
# strict default can break the OAuth popup.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
